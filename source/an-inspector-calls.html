<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>An Inspector Calls</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,600&display=swap">
<style>
/* Layout: fixed left rail (sections of the examination) + one working canvas; rail folds into a top strip on phones. */
:root {
  --bg: #F2F3F0; --surface: #FFFFFF; --surface-2: #EBEEEA; --rail: #E6EAE5;
  --ink: #1B2420; --ink-2: #48544E; --ink-3: #78837D; --line: #D9DED8; --line-2: #C6CDC6;
  --accent: #2B5A4B; --accent-ink: #FFFFFF; --accent-soft: #DFEAE4; --accent-2: #8A6A2E;
  --ok: #2E7A4C; --ok-soft: #DDEEE3; --warn: #9A6210; --warn-soft: #F5E9D3; --bad: #A3392F; --bad-soft: #F5DFDC; --info: #2F5E88; --info-soft: #DEE8F2;
  --mark: #F3E3A6; --shadow: 0 1px 2px rgba(20,30,25,.06), 0 4px 16px rgba(20,30,25,.05);
  --f-display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --f-body: "Hanken Grotesk", "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111513; --surface: #181D1B; --surface-2: #202725; --rail: #151A18;
  --ink: #E4E9E6; --ink-2: #B0BAB4; --ink-3: #828E88; --line: #2B3330; --line-2: #3A4440;
  --accent: #82BCA8; --accent-ink: #0E1915; --accent-soft: #1E302A; --accent-2: #D3B06C;
  --ok: #72C394; --ok-soft: #1B3326; --warn: #E2AE58; --warn-soft: #3A2E17; --bad: #EA8A80; --bad-soft: #3D211E; --info: #8DB8E2; --info-soft: #1B2A3A;
  --mark: #5B4E1E; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111513; --surface: #181D1B; --surface-2: #202725; --rail: #151A18;
  --ink: #E4E9E6; --ink-2: #B0BAB4; --ink-3: #828E88; --line: #2B3330; --line-2: #3A4440;
  --accent: #82BCA8; --accent-ink: #0E1915; --accent-soft: #1E302A; --accent-2: #D3B06C;
  --ok: #72C394; --ok-soft: #1B3326; --warn: #E2AE58; --warn-soft: #3A2E17; --bad: #EA8A80; --bad-soft: #3D211E; --info: #8DB8E2; --info-soft: #1B2A3A;
  --mark: #5B4E1E; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { display: grid; grid-template-columns: 240px minmax(0,1fr); min-height: 100%; }

/* Rail */
.rail { background: var(--rail); border-right: 1px solid var(--line); padding-block: 22px 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.brand-mark { width: 36px; height: 36px; flex: none; display: block; }
.brand-mark svg { display: block; filter: drop-shadow(0 1px 2px rgba(20,30,25,.18)); }
.brand-name { font-family: var(--f-display); font-size: 19px; font-weight: 600; letter-spacing: -.01em; line-height: 1.1; }
.brand-sub { font-size: 11px; color: var(--ink-3); letter-spacing: .04em; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-group { font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); padding: 12px 10px 4px; font-weight: 500; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; color: var(--ink-2); text-decoration: none; font-weight: 500; font-size: 13.5px; white-space: nowrap; }
.nav a svg { flex: none; opacity: .8; }
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.nav a.on svg { color: var(--accent); opacity: 1; }
.nav .count { margin-left: auto; font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.conn { margin-top: auto; display: flex; flex-direction: column; gap: 6px; padding: 12px 10px 0; border-top: 1px solid var(--line); }
.conn-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); flex: none; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }

/* Main */
.main { min-width: 0; padding-block: 28px 64px; padding-left: max(16px, 3vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 3vw); }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); font-weight: 600; }
h1 { font-family: var(--f-display); font-weight: 500; font-size: clamp(26px, 3.2vw, 34px); line-height: 1.15; margin: 4px 0 0; letter-spacing: -.01em; text-wrap: balance; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 19px; margin: 0; letter-spacing: -.005em; }
h3 { font-size: 13px; font-weight: 600; margin: 0; }
.lede { color: var(--ink-2); max-width: 68ch; margin: 6px 0 0; }
.muted { color: var(--ink-3); }
.small { font-size: 12px; }
.mono { font-family: var(--f-mono); font-size: 12px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; }
.card.flush { padding: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 18px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 18px; }
.split { display: grid; grid-template-columns: 300px minmax(0,1fr); gap: 18px; align-items: start; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); padding: 7px 12px; border-radius: 7px; cursor: pointer; font-weight: 500; font-size: 13px; line-height: 1.2; white-space: nowrap; text-decoration: none; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.input, .select, .textarea { width: 100%; border: 1px solid var(--line-2); background: var(--surface); border-radius: 7px; padding: 8px 10px; min-width: 0; }
.textarea { resize: vertical; line-height: 1.55; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-2); font-weight: 500; min-width: 0; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 6px; cursor: pointer; color: var(--ink-2); font-size: 12.5px; font-weight: 500; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 12px; color: var(--ink-2); cursor: pointer; text-align: left; }
.chip:hover { border-color: var(--accent); color: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 600; letter-spacing: .02em; white-space: nowrap; background: var(--surface-2); color: var(--ink-2); }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.bad { background: var(--bad-soft); color: var(--bad); } .pill.info { background: var(--info-soft); color: var(--info); } .pill.acc { background: var(--accent-soft); color: var(--accent); }
.pill.ex { background: transparent; border: 1px dashed var(--line-2); color: var(--ink-3); font-weight: 500; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; cursor: pointer; text-align: left; }
.stat:hover { border-color: var(--line-2); }
.stat .n { font-family: var(--f-display); font-size: 28px; font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 12px; color: var(--ink-2); }
.stat .s { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }

/* Stage stepper */
.stepper { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 4px; margin-top: 16px; }
.step { display: flex; flex-direction: column; gap: 6px; font-size: 11.5px; color: var(--ink-3); cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
.step i { display: block; height: 4px; border-radius: 2px; background: var(--line); }
.step.done i { background: var(--accent); opacity: .55; } .step.cur i { background: var(--accent); }
.step.cur { color: var(--ink); font-weight: 600; } .step.done { color: var(--ink-2); }

/* Lists */
.list { display: flex; flex-direction: column; }
.li { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; }
.li:first-child { border-top: 0; }
.li .grow { flex: 1; min-width: 0; }
.date-badge { flex: none; width: 46px; text-align: center; border: 1px solid var(--line); border-radius: 8px; padding: 3px 0; line-height: 1.1; }
.date-badge b { display: block; font-family: var(--f-display); font-size: 18px; font-weight: 600; }
.date-badge span { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }

/* Tables */
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 600; padding: 10px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
.tbl td { padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr:hover td { background: color-mix(in srgb, var(--surface-2) 45%, transparent); }
.tbl .cell { width: 100%; border: 1px solid transparent; background: transparent; border-radius: 5px; padding: 4px 6px; min-width: 0; }
.tbl .cell:hover { border-color: var(--line); }
.tbl .cell:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.tbl textarea.cell { resize: vertical; min-height: 32px; line-height: 1.45; field-sizing: content; }
.tbl .num { font-variant-numeric: tabular-nums; }

/* Drop zone */
.drop { border: 1.5px dashed var(--line-2); border-radius: 12px; padding: 28px 20px; text-align: center; background: var(--surface); cursor: pointer; transition: border-color .15s, background .15s; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop h2 { margin-top: 8px; }
.bar { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .2s; }

/* Answers */
.convo { display: flex; flex-direction: column; gap: 16px; }
.qa { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.qa-q { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: baseline; background: var(--surface-2); }
.qa-q .q { font-weight: 600; flex: 1; min-width: 0; }
.qa-a { padding: 16px 20px; min-width: 0; }
.activity { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 18px; border-bottom: 1px solid var(--line); font-size: 11.5px; color: var(--ink-3); }
.activity span { background: var(--surface-2); border-radius: 5px; padding: 2px 7px; }
.qa-f { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 18px; border-top: 1px solid var(--line); }
.thinking { color: var(--ink-3); display: flex; gap: 8px; align-items: center; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: .25; transform: scale(.8);} 50% { opacity: 1; transform: scale(1);} }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

.md { max-width: 78ch; line-height: 1.62; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 10px; }
.md h3, .md h4, .md h5, .md h6 { font-family: var(--f-display); font-size: 16.5px; font-weight: 600; margin: 18px 0 6px; }
.md ul, .md ol { margin: 0 0 10px; padding-left: 22px; } .md li { margin: 3px 0; }
.md blockquote { margin: 0 0 10px; padding: 6px 12px; border-left: 3px solid var(--line-2); color: var(--ink-2); font-style: italic; }
.md code { font-family: var(--f-mono); font-size: 12px; background: var(--surface-2); padding: 1px 4px; border-radius: 4px; }
.md table { border-collapse: collapse; margin: 0 0 12px; font-size: 13px; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
.md th { background: var(--surface-2); }
.cite { display: inline-flex; align-items: center; gap: 3px; font-family: var(--f-mono); font-size: 11px; background: var(--accent-soft); color: var(--accent); border: 0; border-radius: 4px; padding: 0 5px; margin: 0 1px; cursor: pointer; vertical-align: 1px; line-height: 1.6; }
.cite:hover { text-decoration: underline; }
.cite.mail { background: var(--info-soft); color: var(--info); }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }

/* Email thread cards */
.mail-card { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); min-width: 0; }
.mail-card .subj { font-weight: 600; overflow-wrap: anywhere; }
.mail-card .meta { font-size: 12px; color: var(--ink-3); overflow-wrap: anywhere; }
.mail-card .snip { font-size: 12.5px; color: var(--ink-2); overflow-wrap: anywhere; }

/* Soundness matrix */
.tests th.t { text-align: center; white-space: normal; min-width: 92px; line-height: 1.25; }
.tcell { display: flex; justify-content: center; }
.tchip { border: 1px solid var(--line-2); background: var(--surface); border-radius: 6px; font-size: 11.5px; font-weight: 600; padding: 4px 8px; cursor: pointer; min-width: 76px; color: var(--ink-3); }
.tchip.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.tchip.concern { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.tchip.unsound { background: var(--bad-soft); border-color: transparent; color: var(--bad); }

/* Notes */
.note-item { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; text-align: left; background: none; width: 100%; }
.note-item:hover { background: var(--surface-2); }
.note-item.on { background: var(--surface); border-color: var(--line); box-shadow: var(--shadow); }
.note-item .t { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note-item .p { font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.title-input { font-family: var(--f-display); font-size: 22px; font-weight: 500; border: 0; background: transparent; width: 100%; padding: 2px 0; }
.title-input:focus { outline: none; }
.editor { min-height: 360px; border: 0; padding: 0; background: transparent; font-size: 14.5px; line-height: 1.7; }
.editor:focus { box-shadow: none; }

/* Drawer + modal */
.scrim { position: fixed; inset: 0; background: rgba(10,15,12,.38); z-index: 40; display: flex; justify-content: flex-end; }
.drawer { width: min(760px, 100%); height: 100%; background: var(--surface); display: flex; flex-direction: column; box-shadow: -10px 0 40px rgba(0,0,0,.18); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer-h { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; }
.drawer-b { padding: 18px 20px; overflow-y: auto; flex: 1; min-height: 0; }
.drawer-f { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pagetext { white-space: pre-wrap; font-size: 13.5px; line-height: 1.65; overflow-wrap: anywhere; }
.modal-scrim { position: fixed; inset: 0; background: rgba(10,15,12,.38); z-index: 50; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 12px; padding: 20px; width: min(440px, 100%); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }
.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 13px; z-index: 60; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.notice { border: 1px solid var(--line); background: var(--surface-2); border-radius: 9px; padding: 10px 14px; font-size: 13px; color: var(--ink-2); display: flex; gap: 10px; align-items: flex-start; }
.notice.warn { background: var(--warn-soft); border-color: transparent; color: var(--ink); }
.notice.bad { background: var(--bad-soft); border-color: transparent; color: var(--ink); }
.empty { text-align: center; padding: 36px 16px; color: var(--ink-3); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty h3 { color: var(--ink); font-size: 15px; }
.welcome { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
.welcome .w { border-top: 2px solid var(--accent); padding-top: 10px; }
.welcome .w b { display: block; margin-bottom: 4px; }
.pdf-frame { width: 100%; height: 70vh; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line-2); border-radius: 4px; padding: 0 4px; }

/* Landing (welcome screen) */
.card { border-radius: 14px; } .stat { border-radius: 14px; }
body.landing .rail { display: none; }
body.landing .app { grid-template-columns: minmax(0,1fr); }
body.landing .main { padding: 0; }
body.landing .wrap { max-width: none; gap: 0; }
.hero-band { background: radial-gradient(120% 160% at 15% 0%, #23664f 0%, #11392d 50%, #0a241d 100%); color: #fff; margin-top: calc(-1 * env(safe-area-inset-top, 0px)); padding-top: calc(env(safe-area-inset-top, 0px) + 40px); padding-bottom: 64px; }
.land-in { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px), 4vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 4vw); }
.hero-top { display: flex; gap: 26px; align-items: center; flex-wrap: wrap; }
.hero-top svg { flex: none; filter: drop-shadow(0 10px 24px rgba(0,0,0,.35)); }
.hero-band h1 { font-family: var(--f-body); font-weight: 300; font-size: clamp(36px, 6vw, 58px); letter-spacing: -.02em; line-height: 1.02; margin: 0; color: #fff; }
.greet { font-size: clamp(19px, 2.4vw, 25px); color: #c3ead9; margin: 8px 0 0; font-weight: 400; }
.hero-meta { color: #8fbfad; font-size: 14px; margin-top: 8px; }

    else { for (const r of rows) text(head.map((hh, j) => hh + ': ' + (r[j] || '')).join(' | '), { size: 9, gap: 4 }); y += 8; }
  }
  const appendix = (title, head, rows) => { if (!rows.length) return; doc.addPage(); y = M; text('APPENDIX', { size: 8.5, style: 'bold', color: ACC, gap: 2 }); text(pdfSafe(title), { size: 16, font: 'times', style: 'bold', gap: 12, lh: 1.2 }); table(head, rows.map(r => r.map(c => pdfSafe(plainCites(c || ''))))); };
  if (R.inc.mm) appendix('Schedule of main modifications', ['Ref', 'Policy / para', 'Main modification', 'Reason', 'Status'], all('mm').sort((a, b) => natural(a.ref, b.ref)).map(m => [m.ref, m.policy, m.change, m.reason, m.status]));
  if (R.inc.act) appendix('Hearing action points', ['Ref', 'Session', 'Action', 'By', 'Due', 'Status'], all('act').sort((a, b) => natural(a.ref, b.ref)).map(a => [a.ref, a.session, a.action, a.owner, a.due ? fmtDate(a.due) : '', a.status]));
  if (R.inc.snd) appendix('Legal compliance and soundness', ['Policy / site', ...TESTS.map(t => t.s), 'Reasoning'], all('snd').sort((a, b) => natural(a.ref, b.ref)).map(r => [(r.ref || '') + ' ' + (r.title || ''), ...TESTS.map(t => TLABEL[(r.t || {})[t.k] || ''] === 'Not assessed' ? '-' : TLABEL[(r.t || {})[t.k] || '']), r.notes]));
  if (R.inc.miq) appendix('Matters, issues and questions', ['Matter', 'Ref', 'Issue', 'Question', 'Status'], all('miq').sort((a, b) => natural(a.matter, b.matter) || natural(a.ref, b.ref)).map(q => [q.matter, q.ref, q.issue, q.question, q.status]));
  if (R.inc.dl) appendix('Key dates', ['Date', 'What', 'Type'], all('dl').sort((a, b) => String(a.date).localeCompare(String(b.date))).map(d => [d.date ? fmtDate(d.date) : '', d.title, d.type]));
  const n = doc.getNumberOfPages();
  for (let p = 1; p <= n; p++) { doc.setPage(p); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...MUTE); doc.text(pdfSafe(clip(w.plan ? w.plan + ' examination' : R.title, 80)), M, H - 30); doc.text('Page ' + p + ' of ' + n, W - M, H - 30, { align: 'right' }); }
  return doc.output('blob');
}
async function makePdf(mode) {
  const R = S.report; let blob;
  try { toast('Building PDF…'); blob = await buildPdf(R); } catch (e) { return toast(e && e.message ? e.message : 'The PDF could not be built.'); }
  const fname = (R.title || 'report').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').slice(0, 60) + '-' + (R.date || todayISO()) + '.pdf';
  if (mode === 'preview') { const url = URL.createObjectURL(blob); const p = $('#pdf-preview'); p && p.replaceChildren(h('div', { class: 'card stack' }, h('div', { class: 'row', style: 'justify-content:space-between' }, h('h3', {}, 'Preview'), h('span', { class: 'small muted' }, fmtBytes(blob.size))), h('iframe', { class: 'pdf-frame', src: url, title: 'PDF preview' }))); p && p.scrollIntoView({ behavior: 'smooth' }); return; }
  if (CAP.downloads === undefined) CAP.downloads = await use('downloads');
  if (!CAP.downloads) return toast('Downloads are not available in this view. Open the page in Claude to save files.');
  try { await CAP.downloads.save({ filename: fname, data: blob }); toast('Saved ' + fname); } catch (e) { toast(e.code === 'declined' ? 'Download cancelled.' : 'The download did not complete (' + e.code + ').'); }
}
