name: Build Windows app

# Builds on every code change, and can be run by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build the Windows installer (Tauri, a few MB)
        shell: bash
        run: |
          npx --yes @tauri-apps/cli@2 build --bundles nsis --config '{"version":"1.0.${{ github.run_number }}"}'
          mkdir -p dist
          cp src-tauri/target/release/bundle/nsis/*-setup.exe dist/Inspector-Calls-Setup.exe
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: inspector-calls-setup
          path: dist/Inspector-Calls-Setup.exe

      - name: Publish as the latest release (direct download link)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIZE=$(du -h dist/Inspector-Calls-Setup.exe | cut -f1)
          TAG="v1.0.${{ github.run_number }}"
          TITLE="An Inspector Calls for Windows (build ${{ github.run_number }})"
          NOTES="Built $(date -u '+%d %b %Y %H:%M') UTC. Installer size: ${SIZE}. Download Inspector-Calls-Setup.exe and run it to install. Windows may say it protected your PC because the app isn't code-signed: choose More info, then Run anyway."
          # Each build gets its own release; the download link always points at the newest:
          # https://github.com/${{ github.repository }}/releases/latest/download/Inspector-Calls-Setup.exe
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          for i in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" dist/Inspector-Calls-Setup.exe --clobber &&
              gh release edit "$TAG" --draft=false --title "$TITLE" --notes "$NOTES" --latest && exit 0
            else
              gh release create "$TAG" dist/Inspector-Calls-Setup.exe --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" --latest && exit 0
            fi
            sleep $((i * 20))
          done
          exit 1
