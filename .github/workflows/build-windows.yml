name: Build Windows app

# Builds on every code change, and can be run by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Set version (build number goes up every run)
        shell: bash
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Build the Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: inspector-calls-setup
          path: dist/Inspector-Calls-Setup.exe

      - name: Publish as the latest release (direct download link)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/Inspector-Calls-Setup.exe \
            --title "An Inspector Calls for Windows (build ${{ github.run_number }})" \
            --notes "Built $(date -u '+%d %b %Y %H:%M') UTC. Download Inspector-Calls-Setup.exe and run it to install. Windows may say it protected your PC because the app isn't code-signed: choose More info, then Run anyway." \
            --latest
